<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leçon — Créer ton premier site web</title>

  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

  <!-- Styles du cours -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-lecon">

  <div class="layout-lecon">

    <!-- ============================================================
         SIDEBAR — navigation entre les leçons
         ============================================================ -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="index.html">← 🌐 Mon cours web</a>
      </div>
      <nav id="sidebar-nav">
        <!-- Généré par app.js -->
      </nav>
    </aside>

    <!-- ============================================================
         ZONE PRINCIPALE
         ============================================================ -->
    <div class="main-lecon">

      <!-- En-tête -->
      <div class="main-header">
        <span class="badge-module">Module</span>
        <h1>Titre de la leçon</h1>
      </div>

      <!-- 3 colonnes : Instructions | Éditeur | Aperçu -->
      <div class="editeur-zone">

        <!-- Colonne 1 : Instructions -->
        <div class="panneau">
          <div class="panneau-titre">📖 Instructions</div>
          <div class="instructions" id="instructions">
            <!-- Généré par app.js -->
          </div>
        </div>

        <!-- Colonne 2 : Éditeur de code -->
        <div class="panneau">
          <div class="panneau-titre">✏️ Éditeur de code</div>
          <div class="editeur-wrapper">
            <textarea id="editeur"></textarea>
          </div>
        </div>

        <!-- Colonne 3 : Aperçu en direct -->
        <div class="panneau">
          <div class="panneau-titre">👁️ Aperçu en direct</div>
          <iframe id="apercu" class="apercu-iframe" title="Aperçu de ton code"></iframe>
        </div>

      </div><!-- .editeur-zone -->

      <!-- Pied de page avec boutons -->
      <div class="main-footer">
        <button class="btn btn-valider"  id="btn-valider">✅ Valider</button>
        <button class="btn btn-solution" id="btn-solution">💡 Voir la solution</button>
        <div id="feedback" class="feedback"></div>
        <button class="btn btn-nav btn-nav-prev" id="btn-prev">← Précédent</button>
        <button class="btn btn-nav" id="btn-next">Suivant →</button>
      </div>

    </div><!-- .main-lecon -->
  </div><!-- .layout-lecon -->

  <!-- CodeMirror scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

  <!-- Données des leçons puis logique applicative -->
  <script src="js/lecons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
